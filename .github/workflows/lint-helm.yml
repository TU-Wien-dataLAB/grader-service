name: Lint Helm Chart

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.12.0

      - name: Lint chart (default values)
        run: helm lint --strict packages/service/charts/grader-service

      - name: Lint chart (optional features enabled)
        run: |
          helm lint --strict packages/service/charts/grader-service \
            --set autogradeExecutorClass=KubeAutogradeExecutor \
            --set ltiSyncGrades.enabled=true
