name: Test Service

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINER_DOCKER_NETWORK: postgresql-testcontainers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --dev

      - name: Install test dependencies
        working-directory: packages/service
        run: uv sync --locked --group test

      - name: Lint with ruff
        run: uv run ruff check packages/service/grader_service

      - name: Create Docker network
        run: docker network create ${{ env.TESTCONTAINER_DOCKER_NETWORK }}

      - name: Run tests
        run: |
          git config --global init.defaultBranch "main"
          git config --global user.name "Grader Test"
          git config --global user.email "grader@example.com"
          uv run pytest packages/service/grader_service/tests \
                --cov=grader_service \
                --cov-report=html:packages/service/htmlcov \
                --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-service
          path: packages/service/htmlcov/
