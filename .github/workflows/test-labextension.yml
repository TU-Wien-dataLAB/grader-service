name: Test Labextension

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0

      - name: Install the project
        run: uv sync --locked --all-packages --dev --group test

      - name: Install npm dependencies
        working-directory: packages/labextension
        run: uv run jlpm

      - name: Lint Python code
        run: uv run ruff check packages/labextension/grader_labextension

      - name: Run Python tests
        run: uv run pytest packages/labextension/grader_labextension/tests

      - name: Run JavaScript tests
        working-directory: packages/labextension
        run: uv run jlpm test
